name: Build and deploy React SPA to Azure Web App - codeflux-ui

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: codeflux-ui
  NODE_VERSION: '24.x'

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build React application
        run: npm run build

      - name: Verify build output
        run: |
          echo "Build contents:"
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_82F5D70AB19E420B8117C5EC35ADA57B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_65E357D7FD5E4EC5B576715A4E14E0D1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A3DC230E4BC447B0B568156EC4777DA0 }}

      - name: Deploy React build to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./dist
