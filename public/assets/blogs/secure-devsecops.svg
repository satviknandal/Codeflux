<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" role="img" aria-labelledby="spsDevTitle spsDevDesc"><title id="spsDevTitle">Secure DevSecOps lifecycle</title><desc id="spsDevDesc">Security moves through design, build, test, and fix and verify, then feeds lessons back into design.</desc><style> .flow{ fill:none; stroke:#91A3BD; stroke-width:2; stroke-linecap:round; stroke-dasharray:7 7; animation:dash 13s linear infinite; } .node{ transform-box:fill-box; transform-origin:center; animation:nodeIn .48s ease both; } .node-2{animation-delay:.06s} .node-3{animation-delay:.12s} .node-4{animation-delay:.18s} .node-title{ fill:#132745; font:700 16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif; } .node-sub{ fill:#64748B; font:500 11.5px Inter,system-ui,-apple-system,"Segoe UI",sans-serif; } .step-num{ fill:#fff; font:800 10px Inter,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; dominant-baseline:middle; } .loop-label{ fill:#66809D; font:700 10px Inter,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.06em; text-transform:uppercase; } @keyframes dash{ to{stroke-dashoffset:-220} } @keyframes nodeIn{ from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} } @media (prefers-reduced-motion:reduce){ .flow,.node{animation:none} .flow{stroke-dasharray:none} } </style><defs><marker id="spsDevArrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#91A3BD"></path></marker></defs><path class="flow" d="M205 119H235 M420 119H450 M635 119H665" marker-end="url(#spsDevArrow)"></path><g class="node"><rect fill="#F3FCFD" height="135" rx="16" stroke="#CDE8EC" width="185" x="20" y="52"></rect><circle cx="47" cy="80" fill="#0E8E9F" r="14"></circle><text class="step-num" x="47" y="80">01</text><text class="node-title" x="36" y="119">Design</text><text class="node-sub" x="36" y="141">Threat model workflows</text><text class="node-sub" x="36" y="159">Roles · APIs · data flows</text></g><g class="node node-2"><rect fill="#F7FAFF" height="135" rx="16" stroke="#CFE0FA" width="185" x="235" y="52"></rect><circle cx="262" cy="80" fill="#315CF3" r="14"></circle><text class="step-num" x="262" y="80">02</text><text class="node-title" x="251" y="119">Build</text><text class="node-sub" x="251" y="141">Secure coding · review</text><text class="node-sub" x="251" y="159">Secrets · dependencies</text></g><g class="node node-3"><rect fill="#F8F7FF" height="135" rx="16" stroke="#DED9F7" width="185" x="450" y="52"></rect><circle cx="477" cy="80" fill="#7455C8" r="14"></circle><text class="step-num" x="477" y="80">03</text><text class="node-title" x="466" y="119">Test</text><text class="node-sub" x="466" y="141">SAST · DAST · SCA</text><text class="node-sub" x="466" y="159">Config checks · pentest</text></g><g class="node node-4"><rect fill="#F3FBF7" height="135" rx="16" stroke="#D2EADF" width="215" x="665" y="52"></rect><circle cx="692" cy="80" fill="#138A63" r="14"></circle><text class="step-num" x="692" y="80">04</text><text class="node-title" x="681" y="119">Fix &amp; Verify</text><text class="node-sub" x="681" y="141">Remediate · retest</text><text class="node-sub" x="681" y="159">Document exceptions</text></g><path d="M773 202 C773 250 130 250 130 202" fill="none" marker-end="url(#spsDevArrow)" stroke="#A6B4C8" stroke-dasharray="5 6" stroke-width="1.8"></path><text class="loop-label" x="375" y="272"> Continuous feedback and verification </text></svg> 